name: Release Build Artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

jobs:
  build-macos:
    name: Build (${{ matrix.arch }} macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install autoconf automake libtool

      - name: Inject CMake deployment target for MLX
        run: |
          REAL_CMAKE=$(which cmake)
          mkdir -p /tmp/cmake-wrapper
          printf '%s\n' '#!/bin/bash' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    --build|--install|-E|--version|--help|--system-information)' \
            '      exec "'"$REAL_CMAKE"'" "$@"' \
            '      ;;' \
            '  esac' \
            'done' \
            'exec "'"$REAL_CMAKE"'" "$@" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0' \
            > /tmp/cmake-wrapper/cmake
          chmod +x /tmp/cmake-wrapper/cmake
          echo "/tmp/cmake-wrapper" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Inject release version
        run: python3 scripts/inject-release-version.py ${{ inputs.version }}

      - name: Build Tauri app
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CFLAGS: "-mmacosx-version-min=14.0"
          CXXFLAGS: "-mmacosx-version-min=14.0"
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.dmg.sig
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libglib2.0-dev patchelf libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Inject release version
        run: python3 scripts/inject-release-version.py ${{ inputs.version }}

      - name: Build Tauri app
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Inject release version
        run: python3 scripts/inject-release-version.py ${{ inputs.version }}

      - name: Build Tauri app
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
