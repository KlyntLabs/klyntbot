name: Release Build Artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

jobs:
  build-macos:
    name: Build (${{ matrix.arch }} macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # MLX (via qwen3-tts-rs) does not support x86_64 macOS, so only arm64
          # is built for alpha releases.
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install autoconf automake libtool

      - name: Inject CMake deployment target and arm64 system processor for MLX
        run: |
          mkdir -p /tmp/cmake-wrapper
          cat > /tmp/cmake-wrapper/cmake <<'EOF'
          #!/bin/bash
          REAL_CMAKE=$(PATH="${PATH//\/tmp\/cmake-wrapper:/}" which cmake)
          for arg in "$@"; do
            case "$arg" in
              --build|--install|-E|--version|--help|--system-information)
                exec "$REAL_CMAKE" "$@"
                ;;
            esac
          done
          EXTRA=("-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0")
          FORCE_ARM64=false
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ -n "$TARGET" ] && [[ "$TARGET" == aarch64* ]]; then
              FORCE_ARM64=true
            elif [ -z "$TARGET" ] && [ "$(uname -m)" = "arm64" ]; then
              FORCE_ARM64=true
            fi
          fi
          if [ "$FORCE_ARM64" = true ]; then
            EXTRA+=("-DCMAKE_SYSTEM_NAME=Darwin")
            EXTRA+=("-DCMAKE_SYSTEM_PROCESSOR=arm64")
          fi
          exec "$REAL_CMAKE" "$@" "${EXTRA[@]}"
          EOF
          chmod +x /tmp/cmake-wrapper/cmake
          echo "/tmp/cmake-wrapper" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Inject release version
        run: python3 scripts/inject-release-version.py ${{ inputs.version }}

      - name: Prepare Tauri signing secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          trim() {
            printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          if [ -n "$KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
              trim "$KEY"
              echo ""
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$PASS" ]; then
            {
              echo "TAURI_KEY_PASSWORD<<EOF"
              trim "$PASS"
              echo ""
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        working-directory: crates/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CFLAGS: "-mmacosx-version-min=14.0"
          CXXFLAGS: "-mmacosx-version-min=14.0"
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.dmg.sig
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error

