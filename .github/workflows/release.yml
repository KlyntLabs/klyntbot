name: Release Alpha

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  version:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      display: ${{ steps.compute.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          python3 scripts/compute-release-version.py alpha >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "version=${{ steps.compute.outputs.version }}"
          echo "tag=${{ steps.compute.outputs.tag }}"
          echo "display=${{ steps.compute.outputs.display }}"

  create-release:
    needs: version
    runs-on: macos-latest
    outputs:
      id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          {
            echo 'NOTES<<EOF'
            git log --pretty=format:'- %s' $(git describe --tags --abbrev=0 --match 'alpha-v*' 2>/dev/null || echo HEAD~50)..HEAD
            echo ''
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.display }}
          body: ${{ env.NOTES }}
          prerelease: true

  build-artifacts:
    needs: [version, create-release]
    uses: ./.github/workflows/release-build-artifacts.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: alpha
    secrets: inherit

  publish-manifest:
    needs: [version, build-artifacts]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: ./release-assets
          merge-multiple: true

      - name: Generate latest.json
        run: |
          python3 scripts/generate-updater-manifest.py \
            --version ${{ needs.version.outputs.version }} \
            --channel alpha \
            --assets ./release-assets \
            --repo ${{ github.repository }} \
            --tag ${{ needs.version.outputs.tag }} \
            --output alpha-latest.json

      - name: Upload manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.version.outputs.tag }} alpha-latest.json --clobber

      - name: Upload app bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          while IFS= read -r -d '' f; do
            ASSETS+=("$f")
          done < <(find ./release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.tar.gz' -o -name '*.tar.gz.sig' \) -print0)
          if [ ${#ASSETS[@]} -gt 0 ]; then
            gh release upload ${{ needs.version.outputs.tag }} "${ASSETS[@]}" --clobber
          fi
