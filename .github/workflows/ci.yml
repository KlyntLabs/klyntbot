name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build tools
        run: |
          brew install automake autoconf libtool cmake pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace --all-features

  desktop-ui-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: desktop-ui
        run: bun run lint

      - name: Type check
        working-directory: desktop-ui
        run: bun run typecheck

      - name: Test
        working-directory: desktop-ui
        run: bun run test

  desktop-build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install autoconf automake libtool

      - name: Inject CMake deployment target and arm64 system processor for MLX
        run: |
          mkdir -p /tmp/cmake-wrapper
          cat > /tmp/cmake-wrapper/cmake <<'EOF'
          #!/bin/bash
          REAL_CMAKE=$(PATH="${PATH//\/tmp\/cmake-wrapper:/}" which cmake)
          for arg in "$@"; do
            case "$arg" in
              --build|--install|-E|--version|--help|--system-information)
                exec "$REAL_CMAKE" "$@"
                ;;
            esac
          done
          EXTRA=("-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0")
          FORCE_ARM64=false
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ -n "$TARGET" ] && [[ "$TARGET" == aarch64* ]]; then
              FORCE_ARM64=true
            elif [ -z "$TARGET" ] && [ "$(uname -m)" = "arm64" ]; then
              FORCE_ARM64=true
            fi
          fi
          if [ "$FORCE_ARM64" = true ]; then
            EXTRA+=("-DCMAKE_SYSTEM_NAME=Darwin")
            EXTRA+=("-DCMAKE_SYSTEM_PROCESSOR=arm64")
          fi
          exec "$REAL_CMAKE" "$@" "${EXTRA[@]}"
          EOF
          chmod +x /tmp/cmake-wrapper/cmake
          echo "/tmp/cmake-wrapper" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Build desktop bundle
        run: cargo tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CFLAGS: "-mmacosx-version-min=14.0"
          CXXFLAGS: "-mmacosx-version-min=14.0"
