name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libglib2.0-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace --all-features

  desktop-ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: desktop-ui
        run: bun run lint

      - name: Type check
        working-directory: desktop-ui
        run: bun run typecheck

      - name: Test
        working-directory: desktop-ui
        run: bun run test

  desktop-build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install autoconf automake libtool

      - name: Inject CMake deployment target for MLX
        run: |
          REAL_CMAKE=$(which cmake)
          mkdir -p /tmp/cmake-wrapper
          printf '%s\n' '#!/bin/bash' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    --build|--install|-E|--version|--help|--system-information)' \
            '      exec "'"$REAL_CMAKE"'" "$@"' \
            '      ;;' \
            '  esac' \
            'done' \
            'exec "'"$REAL_CMAKE"'" "$@" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0' \
            > /tmp/cmake-wrapper/cmake
          chmod +x /tmp/cmake-wrapper/cmake
          echo "/tmp/cmake-wrapper" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-tauri
        run: cargo binstall tauri-cli -y

      - name: Install dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Build desktop bundle
        run: cargo tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CFLAGS: "-mmacosx-version-min=14.0"
          CXXFLAGS: "-mmacosx-version-min=14.0"
