name: KCA Validation

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  validation:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo install cargo-nextest --locked
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kca-${{ hashFiles('**/Cargo.lock') }}
      - name: Lint KCA crates
        run: cargo clippy -p kca-e2e -p kca-bench --all-targets --all-features --no-deps -- -D warnings
      - name: KCA unit + migration tests (no API keys needed)
        run: cargo nextest run -p kca-e2e --test migration_safety
      - name: KCA bench build check
        run: cargo check -p kca-bench

  # Real-API E2E tests require ~/.klyntbot/config.json with provider keys.
  # Run locally or on a self-hosted runner with secrets mounted.
  e2e-real-api:
    if: github.event_name == 'push' && contains(github.ref, 'release')
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-nextest --locked
      - name: Run full KCA E2E suite
        run: ./scripts/run_kca_validation.sh
      - name: Upload game-changer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kca-game-changer
          path: docs/architecture/kca-game-changer.md

  soak:
    if: github.event_name == 'push' && contains(github.ref, 'release')
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-nextest --locked
      - name: Soak test
        run: RUN_SOAK=1 ./scripts/run_kca_validation.sh
