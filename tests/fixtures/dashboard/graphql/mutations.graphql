# ── Todo Mutations ──

mutation CreateTodo($input: CreateTodoInput!) {
  createTodo(input: $input) {
    id title description status priority tags dueDate projectId
  }
}

mutation UpdateTodo($id: ID!, $input: UpdateTodoInput!) {
  updateTodo(id: $id, input: $input) {
    id title description status priority tags dueDate
  }
}

mutation DeleteTodo($id: ID!) {
  deleteTodo(id: $id)
}

mutation CompleteTodo($id: ID!) {
  completeTodo(id: $id) {
    id status
  }
}

mutation FocusTodo($id: ID!, $deadlineHours: Int) {
  focusTodo(id: $id, deadlineHours: $deadlineHours) {
    id status focusDeadline
  }
}

mutation UnfocusTodo($id: ID!) {
  unfocusTodo(id: $id) {
    id status focusDeadline
  }
}

mutation MoveTodo($id: ID!, $parentId: ID, $projectId: ID) {
  moveTodo(id: $id, parentId: $parentId, projectId: $projectId) {
    id parentId projectId
  }
}

mutation ReorderTodo($id: ID!, $afterId: ID) {
  reorderTodo(id: $id, afterId: $afterId) {
    id
  }
}

mutation LogTime($id: ID!, $minutes: Int!, $note: String) {
  logTime(id: $id, minutes: $minutes, note: $note) {
    id timeEntries { id minutes note }
  }
}

mutation AddDependency($id: ID!, $blockedById: ID!) {
  addDependency(id: $id, blockedById: $blockedById) {
    id dependencies
  }
}

mutation RemoveDependency($id: ID!, $blockedById: ID!) {
  removeDependency(id: $id, blockedById: $blockedById) {
    id dependencies
  }
}

# ── Project Mutations ──

mutation CreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    id name description status color tags
  }
}

mutation UpdateProject($id: ID!, $input: UpdateProjectInput!) {
  updateProject(id: $id, input: $input) {
    id name description status color tags
  }
}

mutation ArchiveProject($id: ID!) {
  archiveProject(id: $id) {
    id status
  }
}

# ── Goal Mutations ──

mutation CreateGoal($input: CreateGoalInput!) {
  createGoal(input: $input) {
    id title description status priority targetDate
  }
}

mutation UpdateGoal($id: ID!, $input: UpdateGoalInput!) {
  updateGoal(id: $id, input: $input) {
    id title status
  }
}

mutation UpdateMetric($goalId: ID!, $metricName: String!, $current: Float!) {
  updateMetric(goalId: $goalId, metricName: $metricName, current: $current) {
    id metrics { name current target unit }
  }
}

# ── Plan Mutations ──

mutation CreatePlan($input: CreatePlanInput!) {
  createPlan(input: $input) {
    id title description status steps { id description }
  }
}

mutation ApprovePlan($id: ID!) {
  approvePlan(id: $id) {
    id status
  }
}

mutation ExecutePlan($id: ID!) {
  executePlan(id: $id) {
    id status
  }
}

mutation AbandonPlan($id: ID!) {
  abandonPlan(id: $id) {
    id status
  }
}

# ── Chat Mutation ──

mutation SendMessage($content: String!, $sessionId: String) {
  sendMessage(content: $content, sessionId: $sessionId) {
    id role content timestamp sessionId
  }
}

# ── Settings Mutation ──

mutation UpdateConfig($section: String!, $values: JSON!) {
  updateConfig(section: $section, values: $values) {
    providers { name connected }
  }
}

# ── Calendar Mutation ──

mutation SyncCalendar {
  syncCalendar {
    eventsAdded
    eventsUpdated
    eventsDeleted
    conflictsDetected
    duration
  }
}
