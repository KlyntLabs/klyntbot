# ── Todo Queries ──

query AllTodos {
  todos(limit: 50) {
    nodes { id title status priority tags dueDate }
    totalCount
  }
}

query TodosWithFilter($status: TodoStatus!) {
  todos(filter: { status: $status }, limit: 50) {
    nodes { id title status priority }
    totalCount
  }
}

query SingleTodo($id: ID!) {
  todo(id: $id) {
    id title description status priority tags dueDate
    parentId projectId
    attachments { id type title path }
    timeEntries { id minutes note createdAt }
    dependencies
  }
}

query TodoTree($projectId: ID, $depth: Int) {
  todoTree(projectId: $projectId, depth: $depth) {
    id title status priority
    children { id title status }
  }
}

query TodoSummary {
  todoSummary {
    totalCount
    byStatus { todo doing done }
    byPriority { critical high medium low }
    overdue
    focusActive
  }
}

# ── Search Queries ──

query KeywordSearch($query: String!) {
  searchTodos(query: $query, mode: KEYWORD) {
    id title score
  }
}

query SemanticSearch($query: String!, $threshold: Float) {
  searchTodos(query: $query, mode: SEMANTIC) {
    id title score
  }
}

query HybridSearch($query: String!) {
  searchTodos(query: $query, mode: HYBRID) {
    id title score
  }
}

# ── Project Queries ──

query AllProjects($status: ProjectStatus) {
  projects(filter: { status: $status }, limit: 20) {
    id name description status color tags
  }
}

query SingleProject($id: ID!) {
  project(id: $id) {
    id name description status color tags
  }
}

# ── Goal Queries ──

query AllGoals {
  goals {
    id title description status priority targetDate
    metrics { name current target unit }
  }
}

query SingleGoal($id: ID!) {
  goal(id: $id) {
    id title description status priority targetDate
    metrics { name current target unit }
    linkedProjectIds
  }
}

# ── Plan Queries ──

query AllPlans($status: PlanStatus) {
  plans(filter: { status: $status }) {
    id title status
    steps { id description status attemptCount }
  }
}

query SinglePlan($id: ID!) {
  plan(id: $id) {
    id title description status
    steps { id description status result attemptCount }
    backtrackHistory { stepId reason regeneratedSteps }
    iterationLimit
  }
}

# ── System Queries ──

query SystemStatus {
  systemStatus {
    agentRunning
    uptime
    connectedChannels
    calendarSyncStatus
    lastCalendarSync
    activeModel
    dataFileSizes { todos projects goals plans }
  }
}

query Config {
  config {
    providers { name connected defaultModel }
    channels { name enabled connected }
    tools { restrictToWorkspace workspace }
    calendar { syncIntervalSeconds autoSync }
    enrichment { enabled autoApplyThreshold }
    search { enabled semanticThreshold }
  }
}

query CronJobs {
  cronJobs { name schedule enabled lastRun nextRun }
}

query Sessions($limit: Int) {
  sessions(limit: $limit) {
    id name lastMessage timestamp
  }
}
