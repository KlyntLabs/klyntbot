[persona]
name = "software_engineer_vn"
timezone = "Asia/Ho_Chi_Minh"
language = "en"
seed = 42

[persona.messages_per_day]
onboarding = 8
routine = 5
power_user = 7
shift = 4

[persona.profile]
known_facts = [
    { subject = "user", predicate = "works_as", object = "software engineer" },
    { subject = "user", predicate = "prefers_language", object = "Rust" },
    { subject = "user", predicate = "manages_project", object = "Klynt API rewrite" },
    { subject = "user", predicate = "tracks_currency", object = "VND" },
    { subject = "user", predicate = "works_at", object = "startup" },
    { subject = "user", predicate = "location", object = "Ho Chi Minh City" },
]

[persona.phases.onboarding]
duration_days = 14
correction_rate = 0.25
topic_weights = { tasks = 0.4, notes = 0.3, finance = 0.1, chat = 0.2 }
new_fact_introduction_rate = 0.6
tool_action_rate = 0.5

[persona.phases.routine]
duration_days = 75
correction_rate = 0.10
new_facts = [
    { subject = "user", predicate = "tracks_currency", object = "USD" },
]
topic_weights = { tasks = 0.3, notes = 0.2, finance = 0.2, productivity = 0.2, chat = 0.1 }
new_fact_introduction_rate = 0.15
tool_action_rate = 0.7

[persona.phases.power_user]
duration_days = 90
correction_rate = 0.05
new_facts = [
    { subject = "user", predicate = "prefers_language", object = "Python" },
    { subject = "user", predicate = "works_at", object = "remote" },
]
topic_weights = { tasks = 0.15, notes = 0.10, finance = 0.10, productivity = 0.10, automation = 0.10, insights = 0.05, chat = 0.05, cross_feature_parallel = 0.15, cross_feature_sequential = 0.10, learning = 0.05, coaching = 0.05 }
new_fact_introduction_rate = 0.05
tool_action_rate = 0.8
adversarial_rate = 0.08
error_injection_rate = 0.03
provider_error_rate = 0.02

[persona.phases.behavior_shift]
duration_days = 90
correction_rate = 0.12
shift_description = "User switches from backend to ML focus"
new_facts = [
    { subject = "user", predicate = "learning", object = "PyTorch" },
    { subject = "user", predicate = "project_focus", object = "ML pipeline" },
    { subject = "user", predicate = "works_as", object = "ML engineer" },
    { subject = "user", predicate = "manages_project", object = "ML pipeline" },
]
topic_weights = { tasks = 0.2, notes = 0.3, finance = 0.1, learning = 0.25, chat = 0.15 }
new_fact_introduction_rate = 0.4
tool_action_rate = 0.6

[simulation]
# Per-epoch metrics (task_completion_rate, routing_stability) have high variance
# due to phase transitions — routing_stability legitimately drops during
# behavior_shift as the topic distribution changes and chat messages no longer
# inflate the match rate. Use 50% threshold to tolerate cross-phase variance.
regression_threshold = 75.0
agent_mode = true
agent_breakpoint_threshold = 0.50
agent_provider = "deepseek"
agent_model = "deepseek-chat"
multi_turn_history_depth = 5
followup_rate = 0.15

[[checkpoints]]
at_day = 14
assertions = [
    { type = "metric_above", metric = "knowledge_retention", threshold = 0.3 },
]

[[checkpoints]]
at_day = 90
assertions = [
    { type = "metric_above", metric = "knowledge_retention", threshold = 0.3 },
    { type = "metric_above", metric = "personalization_score", threshold = 0.2 },
]

[[checkpoints]]
at_day = 180
assertions = [
    { type = "metric_above", metric = "knowledge_retention", threshold = 0.4 },
]

[[checkpoints]]
at_day = 269
assertions = [
    { type = "metric_above", metric = "knowledge_retention", threshold = 0.5 },
]
