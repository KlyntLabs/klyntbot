[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/config",
    "crates/bus",
    "crates/providers",
    "crates/session",
    "crates/scheduling",
    "crates/skill-system",
    "crates/tools",
    "crates/channels",
    "crates/agent",
    "crates/context_engine",
    "crates/storage",
    "crates/tools-core",
    "crates/tools-core-macros",
    "crates/analytics",
    "crates/mcp",
    "crates/notifications",
    "crates/desktop-shared",
    "crates/desktop",
    "crates/feature-notes",
    "crates/feature-productivity",
    "crates/cognitive",
    "crates/cognitive-memory",
    "crates/cognitive-schema",
    "crates/cognitive-learning",
    "crates/cognitive-graph",
    "crates/feature-coaching",
    "crates/feature-insights",
    "crates/app-core",
    "crates/activity-log",
    "crates/approval",
    "crates/feature-alarms",
    "crates/feature-tasks",
    "crates/feature-focus",
    "crates/feature-launcher",
    "crates/klynt-core",
    "crates/klynt-execpolicy",
    "crates/klynt-hooks",
    "crates/klynt-protocol",
    "crates/klynt-pty",
    "crates/klynt-sandbox",
    "crates/klynt-sandbox-helper",
    "crates/klynt-skill-loader",
    "crates/klyntbot-server",
    "crates/feature-learning",
    "crates/platform-input",
    "crates/platform-capture",
    "crates/platform-macos",
    "crates/autotuner",
    "crates/voice-engine",
    "crates/feature-language-learning",
    "crates/ai-core",
    "crates/ai-core-macros",
    "crates/mcp-bridge",
    "crates/desktop-macros",
    "crates/klynt-process-hardening",
    "crates/klynt-truncation",
    "crates/klynt-git-utils",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
multimap = "0.10"
portable-pty = "0.8"
shlex = "1.3"
starlark = "0.13.0"
subtle = "2"
walkdir = "2"
schemars = "0.8.22"
ulid = "1.1"
vte = "0.13"
chrono = { version = "0.4", default-features = false }
futures = "0.3"
meval = "0.2"
nucleo-matcher = "0.3"
arc-swap = "1.7"
smol_str = "0.3"
rustc-hash = "2"
fst = "0.4"
roaring = "0.11"
parking_lot = "0.12"
blake3 = "1"
tiktoken-rs = "0.11"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
lru = "0.18"
chrono-tz = "0.10"
md5 = "0.8"
filetime = "0.2.29"
assert_cmd = "2.2.2"
petgraph = "0.8"
hex = "0.4"
similar = "3"
serde-saphyr = "0.0.26"
heck = "0.5"
trybuild = "1"
bstr = "1"
diffy = "0.5"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
toml = "1.1"
cpal = "0.17"
hound = "3.5"
webrtc-vad = "0.4"
nnnoiseless = "0.5"
qwen3-asr = { version = "0.2", default-features = false, features = ["metal", "hub"] }
qwen3-tts-rs = { version = "0.2", default-features = false, features = ["mlx"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
screencapturekit = "0.3.6"
core-media-rs = "0.3"
core-video-rs = "0.3"
landlock = "0.4"
nix = { version = "0.31", features = ["process"] }
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2"

# Internal workspace crates
common = { path = "crates/common" }
config = { path = "crates/config" }
bus = { path = "crates/bus" }
providers = { path = "crates/providers" }
session = { path = "crates/session" }
scheduling = { path = "crates/scheduling" }
skill-system = { path = "crates/skill-system" }
tools = { path = "crates/tools" }
channels = { path = "crates/channels" }
agent = { path = "crates/agent" }
context_engine = { path = "crates/context_engine" }
storage = { path = "crates/storage" }
tools-core = { path = "crates/tools-core" }
tools-core-macros = { path = "crates/tools-core-macros" }
feature-notes = { path = "crates/feature-notes" }
feature-productivity = { path = "crates/feature-productivity" }
cognitive = { path = "crates/cognitive" }
cognitive-memory = { path = "crates/cognitive-memory" }
cognitive-schema = { path = "crates/cognitive-schema" }
cognitive-learning = { path = "crates/cognitive-learning" }
cognitive-graph = { path = "crates/cognitive-graph" }
feature-coaching = { path = "crates/feature-coaching" }
feature-insights = { path = "crates/feature-insights" }
desktop-shared = { path = "crates/desktop-shared" }
desktop = { path = "crates/desktop" }
app-core = { path = "crates/app-core" }
activity-log = { path = "crates/activity-log" }
approval = { path = "crates/approval" }
feature-alarms = { path = "crates/feature-alarms" }
feature-tasks = { path = "crates/feature-tasks" }
feature-focus = { path = "crates/feature-focus" }
feature-launcher = { path = "crates/feature-launcher" }
feature-learning = { path = "crates/feature-learning" }
klyntbot-server = { path = "crates/klyntbot-server" }
klynt-execpolicy = { path = "crates/klynt-execpolicy" }
klynt-protocol = { path = "crates/klynt-protocol" }
klynt-pty = { path = "crates/klynt-pty" }
klynt-sandbox = { path = "crates/klynt-sandbox" }
klynt-hooks = { path = "crates/klynt-hooks" }
klynt-sandbox-helper = { path = "crates/klynt-sandbox-helper" }
klynt-skill-loader = { path = "crates/klynt-skill-loader" }
platform-macos = { path = "crates/platform-macos" }
autotuner = { path = "crates/autotuner" }
voice-engine = { path = "crates/voice-engine" }
feature-language-learning = { path = "crates/feature-language-learning" }
ai-core = { path = "crates/ai-core" }
ai-core-macros = { path = "crates/ai-core-macros" }
klynt-core = { path = "crates/klynt-core" }
mcp = { path = "crates/mcp" }
notifications = { path = "crates/notifications" }
rmcp = { version = "0.17", default-features = false }

# Proc-macro dependencies
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
linkme = "0.3"

# Shared external dependencies (version pinned at workspace level)
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal", "fs", "process"] }
tokio-test = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "uuid", "json"] }
quick-xml = "0.36"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
anyhow = "1.0.101"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
dirs = "6.0.0"
cron = "0.15.0"
base64 = "0.22.1"
regex = "1.11.2"
shellexpand = "3.1.0"
ignore = "0.4"
globset = "0.4"
serde_yaml = "0.9.34"
scraper = "0.22.0"
html2text = "0.13.1"
url = "2.5.4"
which = "7.0.0"
mime_guess = "2.0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "fs"] }
tower = { version = "0.5", features = ["util"] }
include_dir = { version = "0.7", features = ["glob"] }
urlencoding = "2.1"
indexmap = "2"
libc = "0.2"
once_cell = "1.19"
pretty_assertions = "1"
futures-util = "0.3.31"
crossterm = "0.28"
unicode-width = "0.2"
tokio-util = "0.7"
tempfile = "3.14"
jiff = { version = "0.2", features = ["serde", "tz-system"] }
iana-time-zone = "0.1"
rrule = "0.14"
specta = { version = "=2.0.0-rc.22", default-features = false, features = ["derive", "uuid", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", default-features = false, features = ["derive", "typescript"] }
aho-corasick = "1"
fastembed = "5"
lance = "=4.0.0"
lance-io = "4"
lancedb = "0.27"
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
dashmap = "6"
mimalloc = "0.1"
open = "5"
rand = "0.9"
rust_decimal = { version = "1.36", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
rand_chacha = "0.9"
proptest = "1.5"
analytics = { path = "crates/analytics" }
notify = "7"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"
sha2 = "0.11"

# Optional email dependencies
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.19", features = ["tokio1-native-tls"] }
mail-parser = "0.11.1"
native-tls = "0.2.13"
tokio-native-tls = "0.3"

# Root klyntbot crate (facade + binary)
[package]
name = "klyntbot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["email"]
email = ["channels/email"]
browser-integration = ["tools/browser-integration"]
soak = []

[dependencies]
# Re-export all workspace crates
common.workspace = true
config.workspace = true
bus.workspace = true
providers.workspace = true
session.workspace = true
scheduling.workspace = true
tools.workspace = true
channels.workspace = true
activity-log.workspace = true
agent.workspace = true
app-core.workspace = true
cognitive.workspace = true
context_engine.workspace = true
feature-coaching.workspace = true
storage.workspace = true
mcp.workspace = true
notifications.workspace = true

[dev-dependencies]
ai-core.workspace = true
ai-core-macros.workspace = true
app-core.workspace = true
jiff.workspace = true
tempfile.workspace = true
async-trait.workspace = true
sqlx.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
feature-tasks.workspace = true
feature-productivity.workspace = true
feature-coaching.workspace = true
tools-core.workspace = true
dashmap.workspace = true
assert_cmd.workspace = true
serde.workspace = true
klynt-core.workspace = true
klynt-execpolicy.workspace = true
proptest.workspace = true
tokio-test.workspace = true
walkdir.workspace = true

[profile.dev]
opt-level = 0
debug = "line-tables-only"  # Full DWARF = 4.4GB mapped into RSS. Line-tables keeps stack traces.

[profile.dev.package."*"]
opt-level = 2
debug = false  # Deps don't need debug info — saves ~4GB of DWARF sections.

[profile.dev.package.arrow]
opt-level = 3
[profile.dev.package.arrow-array]
opt-level = 3
[profile.dev.package.arrow-buffer]
opt-level = 3
[profile.dev.package.arrow-cast]
opt-level = 3
[profile.dev.package.arrow-data]
opt-level = 3
[profile.dev.package.arrow-ipc]
opt-level = 3
[profile.dev.package.arrow-schema]
opt-level = 3
[profile.dev.package.arrow-select]
opt-level = 3
[profile.dev.package.lance]
opt-level = 3
[profile.dev.package.lance-core]
opt-level = 3
[profile.dev.package.lance-encoding]
opt-level = 3
[profile.dev.package.lance-file]
opt-level = 3
[profile.dev.package.lance-index]
opt-level = 3
[profile.dev.package.lance-io]
opt-level = 3
[profile.dev.package.lance-linalg]
opt-level = 3
[profile.dev.package.lance-table]
opt-level = 3
[profile.dev.package.lancedb]
opt-level = 3
[profile.dev.package.fastembed]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.mimalloc]
opt-level = 3

[profile.dev.package.sqlx]
opt-level = 2
[profile.dev.package.reqwest]
opt-level = 2
[profile.dev.package.serde]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.tokio]
opt-level = 2

[workspace.lints]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
