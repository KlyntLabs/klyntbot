[package]
name = "klyntbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = ["email"]
email = ["dep:async-imap", "dep:lettre", "dep:mail-parser", "dep:native-tls", "dep:tokio-native-tls"]

[dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal", "fs", "process"] }
async-trait = "0.1.89"

# CLI
clap = { version = "4.5.57", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# HTTP client (for LLM providers)
reqwest = { version = "0.13.2", features = ["json", "rustls", "multipart", "stream"] }

# WebSocket
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.101"

# Date/Time
chrono = { version = "0.4.43", features = ["serde"] }

# UUID
uuid = { version = "1.20.0", features = ["v4", "serde"] }

# Path manipulation
dirs = "6.0.0"

# Cron parsing
cron = "0.15.0"

# REPL/prompt
rustyline = "17.0.2"

# Base64 encoding
base64 = "0.22.1"

# Regex
regex = "1.11.2"

# Path expansion
shellexpand = "3.1.0"

# YAML parsing for skills
serde_yaml = "0.9.34"

# HTML parsing and extraction
scraper = "0.22.0"
html2text = "0.13.1"

# URL parsing
url = "2.5.4"

# Binary lookup
which = "7.0.0"

# MIME type detection
mime_guess = "2.0.5"
urlencoding = "2.1"
futures-util = "0.3.31"

# Email dependencies (optional, enabled by default via "email" feature)
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"], optional = true }
lettre = { version = "0.11.19", features = ["tokio1-native-tls"], optional = true }
mail-parser = { version = "0.11.1", optional = true }
native-tls = { version = "0.2.13", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
