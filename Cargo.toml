[workspace]
resolver = "2"
members = [
    "crates/klyntbot-core",
    "crates/klyntbot-config",
    "crates/klyntbot-bus",
    "crates/klyntbot-providers",
    "crates/klyntbot-session",
    "crates/klyntbot-cron",
    "crates/klyntbot-tools",
    "crates/klyntbot-channels",
    "crates/klyntbot-heartbeat",
    "crates/klyntbot-agent",
    "crates/klyntbot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
klyntbot-core = { path = "crates/klyntbot-core" }
klyntbot-config = { path = "crates/klyntbot-config" }
klyntbot-bus = { path = "crates/klyntbot-bus" }
klyntbot-providers = { path = "crates/klyntbot-providers" }
klyntbot-session = { path = "crates/klyntbot-session" }
klyntbot-cron = { path = "crates/klyntbot-cron" }
klyntbot-tools = { path = "crates/klyntbot-tools" }
klyntbot-channels = { path = "crates/klyntbot-channels" }
klyntbot-heartbeat = { path = "crates/klyntbot-heartbeat" }
klyntbot-agent = { path = "crates/klyntbot-agent" }
klyntbot-cli = { path = "crates/klyntbot-cli" }

# Shared external dependencies (version pinned at workspace level)
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal", "fs", "process"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["json", "rustls", "multipart", "stream"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
anyhow = "1.0.101"
chrono = { version = "0.4.43", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
dirs = "6.0.0"
cron = "0.15.0"
clap = { version = "4.5.57", features = ["derive"] }
rustyline = "17.0.2"
base64 = "0.22.1"
regex = "1.11.2"
shellexpand = "3.1.0"
serde_yaml = "0.9.34"
scraper = "0.22.0"
html2text = "0.13.1"
url = "2.5.4"
which = "7.0.0"
mime_guess = "2.0.5"
urlencoding = "2.1"
futures-util = "0.3.31"
tempfile = "3.14"

# Optional email dependencies
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.19", features = ["tokio1-native-tls"] }
mail-parser = "0.11.1"
native-tls = "0.2.13"
tokio-native-tls = "0.3"

# Root klyntbot crate (facade + binary)
[package]
name = "klyntbot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["email"]
email = ["klyntbot-channels/email"]

[dependencies]
# Re-export all workspace crates
klyntbot-core.workspace = true
klyntbot-config.workspace = true
klyntbot-bus.workspace = true
klyntbot-providers.workspace = true
klyntbot-session.workspace = true
klyntbot-cron.workspace = true
klyntbot-tools.workspace = true
klyntbot-channels.workspace = true
klyntbot-heartbeat.workspace = true
klyntbot-agent.workspace = true
klyntbot-cli.workspace = true

# Binary-specific dependencies
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true
serde_json.workspace = true
chrono.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
