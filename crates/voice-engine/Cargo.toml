[package]
name = "voice-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
config.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
platform-macos.workspace = true
cpal = "0.15"
hound = "3.5"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "fs"] }
tracing.workspace = true
jiff.workspace = true
webrtc-vad = { version = "0.4", optional = true }
nnnoiseless = { version = "0.5", optional = true }
qwen3-asr = { version = "0.2", default-features = false, features = ["metal", "hub"] }
qwen3-tts-rs = { version = "0.2", optional = true, default-features = false, features = ["mlx"] }
pitch-detection = { version = "0.3", optional = true }

[features]
default = ["vad"]
vad = ["dep:webrtc-vad", "dep:nnnoiseless"]
qwen3 = ["dep:qwen3-tts-rs", "dep:pitch-detection"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
