[package]
name = "voice-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
platform-macos.workspace = true
cpal = "0.15"
hound = "3.5"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "fs"] }
tracing.workspace = true
chrono.workspace = true
whisper-rs = { version = "0.16", features = ["metal"] }
kokoro-tts = { version = "0.3", optional = true }
webrtc-vad = { version = "0.4", optional = true }
nnnoiseless = { version = "0.5", optional = true }

[features]
default = ["kokoro", "vad"]
kokoro = ["dep:kokoro-tts"]
vad = ["dep:webrtc-vad", "dep:nnnoiseless"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
