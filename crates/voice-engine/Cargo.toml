[package]
name = "voice-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
config.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
platform-macos.workspace = true
cpal.workspace = true
hound.workspace = true
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "fs"] }
tracing.workspace = true
jiff.workspace = true
webrtc-vad = { workspace = true, optional = true }
nnnoiseless = { workspace = true, optional = true }
qwen3-asr.workspace = true
qwen3-tts-rs = { workspace = true, optional = true }

[features]
default = ["vad"]
vad = ["dep:webrtc-vad", "dep:nnnoiseless"]
qwen3 = ["dep:qwen3-tts-rs"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
