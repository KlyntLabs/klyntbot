[package]
name = "klyntbot-plugin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "SDK for building klyntbot WASM plugins"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
