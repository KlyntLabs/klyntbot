[package]
name = "cognitive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Thin facade over the cognitive crate family. Downstream crates depend on
# `cognitive` and reach every concern through this single re-export surface;
# the concerns themselves live in cognitive-memory / -reforge / -mirror /
# -graph / -learning / -schema.

[dependencies]
cognitive-memory = { workspace = true }
cognitive-reforge = { workspace = true }
cognitive-mirror = { workspace = true }
