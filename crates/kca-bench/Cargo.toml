[package]
name = "kca-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
kca-e2e = { path = "../kca-e2e" }
common = { path = "../common" }
config = { path = "../config" }
storage = { path = "../storage" }
cognitive = { path = "../cognitive" }
coding-memory = { path = "../coding-memory" }
agent = { path = "../agent" }
app-core = { path = "../app-core" }
providers = { path = "../providers" }

tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
jiff = { workspace = true }
sqlx = { workspace = true }
petgraph = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bin]]
name = "run-locomo-real"
path = "src/bin/run_locomo_real.rs"

[[bin]]
name = "analyze-trace"
path = "src/bin/analyze_trace.rs"

[[bin]]
name = "gen-soak"
path = "src/bin/gen_soak.rs"

[[bench]]
name = "full_pipeline"
harness = false

[[bench]]
name = "ppr_only"
harness = false

[[bench]]
name = "extraction_path"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
