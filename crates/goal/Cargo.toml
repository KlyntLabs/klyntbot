[package]
name = "goal"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace crates
common = { path = "../common" }
config = { path = "../config" }
storage = { path = "../storage" }

# Data structures
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["fs", "io-util"] }

# Async traits
async-trait.workspace = true

# Logging
tracing = "0.1"

# Directories
dirs = "6.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3.0"
