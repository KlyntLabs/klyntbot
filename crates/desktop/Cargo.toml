[package]
name = "desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app-core = { workspace = true }
approval = { workspace = true }
autotuner = { workspace = true }
desktop-shared = { workspace = true }
bus = { workspace = true }
cognitive = { workspace = true }
common = { workspace = true }
config = { workspace = true }
feature-focus = { workspace = true }
feature-launcher = { workspace = true }
klyntbot-server = { workspace = true }
dashmap = { workspace = true }
feature-productivity = { workspace = true }
platform-macos = { workspace = true }
session = { workspace = true }
storage = { workspace = true }
voice-engine = { workspace = true }
tools-core = { workspace = true }
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-process.workspace = true
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }
axum = { workspace = true }
tower-http = { workspace = true }
open = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
clap.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
mcp-bridge = { path = "../mcp-bridge" }
klynt-process-hardening = { path = "../klynt-process-hardening" }
mimalloc = { workspace = true }
specta = { workspace = true }
linkme = { workspace = true }
desktop-macros = { path = "../desktop-macros" }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[[bench]]
name = "event_transport_latency"
harness = false

[[bench]]
name = "relay_cleanup_latency"
harness = false

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = ["qwen3"]
qwen3 = ["app-core/qwen3"]
