[package]
name = "desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { workspace = true }
approval = { workspace = true }
autotuner = { workspace = true }
coding-ingest = { workspace = true }
desktop-shared = { workspace = true }
bus = { workspace = true }
cognitive = { workspace = true }
common = { workspace = true }
config = { workspace = true }
feature-coding-todo = { workspace = true }
feature-coding-bash = { path = "../feature-coding-bash" }
feature-focus = { workspace = true }
feature-launcher = { workspace = true }
klyntbot-server = { workspace = true }
dashmap = { workspace = true }
feature-productivity = { workspace = true }
platform-macos = { workspace = true }
session = { workspace = true }
storage = { workspace = true }
voice-engine = { workspace = true }
tools-core = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
axum = { workspace = true }
tower-http = { workspace = true }
open = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
mcp-bridge = { path = "../mcp-bridge" }
coding-agents-md = { path = "../coding-agents-md" }
klynt-process-hardening = { path = "../klynt-process-hardening" }
mimalloc = { workspace = true }
specta = { workspace = true }
linkme = { workspace = true }
desktop-macros = { path = "../desktop-macros" }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[[bench]]
name = "event_transport_latency"
harness = false

[[bench]]
name = "relay_cleanup_latency"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["qwen3"]
qwen3 = ["app-core/qwen3"]
