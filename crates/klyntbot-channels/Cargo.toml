[package]
name = "klyntbot-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["email"]
email = ["dep:async-imap", "dep:lettre", "dep:mail-parser", "dep:native-tls", "dep:tokio-native-tls"]

[dependencies]
klyntbot-core.workspace = true
klyntbot-bus.workspace = true
klyntbot-config.workspace = true
klyntbot-providers.workspace = true
async-trait.workspace = true
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex.workspace = true
tracing.workspace = true
dirs.workspace = true
base64.workspace = true
mime_guess.workspace = true
futures-util.workspace = true
html2text.workspace = true

# Optional email dependencies
async-imap = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
mail-parser = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }
tokio-native-tls = { workspace = true, optional = true }
